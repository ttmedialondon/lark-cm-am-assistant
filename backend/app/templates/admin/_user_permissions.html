{% if admin_role == 'owner' and not permission_access.is_owner and not permission_access.is_owner_account %}
<details class="admin-users__permission-editor">
  <summary>设置权限</summary>
  <form action="/admin/users/{{ user.id }}/permissions" method="post" class="mt-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="page" value="{{ permission_page }}">
    <input type="hidden" name="q" value="{{ q|default('') }}">
    <input type="hidden" name="permission_filter" value="{{ permission_filter|default('all') }}">
    <fieldset>
      <legend class="form-label mb-2">{{ user.display_name }} 的页面与操作权限</legend>
      <div class="admin-users__permission-grid">
        {% for permission in permission_pages %}<label class="admin-users__permission-option"><input class="form-check-input" type="checkbox" name="permissions" value="{{ permission.key }}"{% if permission.key in permission_access.configured_permissions %} checked{% endif %}><span><span class="fw-medium">{{ permission.label }}</span><span class="admin-users__permission-description">{{ permission.description }}</span></span></label>{% endfor %}
      </div>
    </fieldset>
    <p class="admin-users__sensitive-note">“达人完整管理”允许跨 CM 导入和核对名单，其余页面只读。“消息内容”受所选 CM 范围限制；设置权限仅限系统主人。</p>
    <div class="d-flex flex-wrap align-items-center gap-2"><button class="btn btn-sm btn-primary" type="submit">保存权限</button><span class="text-secondary small">全部不勾选 = 仅前台</span></div>
  </form>
</details>
{% endif %}
