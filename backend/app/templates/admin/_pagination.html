{% if pager.previous_url or pager.next_url %}
<div class="card-footer d-flex align-items-center justify-content-between">
  {% if pager.previous_url %}<a class="btn btn-sm btn-outline-secondary" href="{{ pager.previous_url }}">上一页</a>{% else %}<span></span>{% endif %}
  <span class="text-secondary small">第 {{ pager.page }} 页</span>
  {% if pager.next_url %}<a class="btn btn-sm btn-outline-secondary" href="{{ pager.next_url }}">下一页</a>{% else %}<span></span>{% endif %}
</div>
{% endif %}
