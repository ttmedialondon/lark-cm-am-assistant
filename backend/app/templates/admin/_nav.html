      {% if admin_role == 'owner' %}<a class="btn btn-sm {% if active_page == 'ai' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/admin/ai">AI 功能</a>{% endif %}
      <a class="btn btn-sm {% if active_page == 'jobs' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/admin/jobs">同步任务</a>
