<div id="dashboard-stats" hx-get="/dashboard/stats" hx-trigger="every 10s [!document.hidden]" hx-swap="outerHTML" class="mb-4" role="status" aria-live="polite">
  {% if stats.preparing %}
  <section class="workbench-preparing" aria-labelledby="workbench-preparing-title">
    <span class="workbench-preparing__symbol" aria-hidden="true">✦</span>
    <div><h2 id="workbench-preparing-title">{{ stats.status }}</h2><p>{{ stats.detail }}</p></div>
  </section>
  {% else %}
  <div class="workbench-connection">
    <span class="badge bg-{{ stats.badge }}-lt">{{ stats.status }}</span>
    {% if stats.detail %}<span class="text-secondary">{{ stats.detail }}</span>{% endif %}
    {% if stats.needs_authorization %}<a class="btn btn-sm btn-outline-warning" href="/auth/lark/start">重新连接</a>{% endif %}
  </div>
  {% endif %}
</div>
